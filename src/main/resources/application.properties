spring.application.name=dio-budgeting-ai
server.port=8080

# H2 local: simples para demonstracao do desafio
spring.datasource.url=jdbc:h2:file:./data/budgeting;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAI / Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.audio.transcription.options.model=gpt-4o-mini-transcribe
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=alloy

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
